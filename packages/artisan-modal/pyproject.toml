[project]
name = "artisan-modal"
version = "0.1.0.dev0"
description = "Modal assignment workers for Artisan"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
dependencies = [
    "dexterity-artisan==0.2.0.dev0",
    "modal==1.4.1",
    "s3fs==2026.2.0",
]

[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artisan_modal"]
