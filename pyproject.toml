[project]
name = "dexterity-artisan"
dynamic = ["version"]
description = "A domain-agnostic pipeline framework with provenance tracking"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
authors = [{name = "Andrew Colin Hunt"}]
maintainers = [{name = "Andrew Colin Hunt"}]
keywords = ["pipeline", "provenance", "workflow", "reproducibility", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []  # All dependencies managed by Pixi

[project.optional-dependencies]
s3 = ["s3fs"]
gcs = ["gcsfs"]
modal = ["modal"]

[project.scripts]
artisan = "artisan.cli:main"

[project.urls]
Homepage = "https://github.com/dexterity-systems/artisan"
Repository = "https://github.com/dexterity-systems/artisan"
Documentation = "https://artisan.readthedocs.io"
"Bug Tracker" = "https://github.com/dexterity-systems/artisan/issues"

# Build settings ----------------------------------------------------------------------
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/artisan/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/artisan"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

# =============================================================================
# DEFAULT ENVIRONMENT - Core runtime dependencies
# =============================================================================
[tool.pixi.dependencies]
# Python
python = "3.12.*"

# Interactive notebook widgets (for provenance stepper)
ipywidgets = "*"

# Jupyter kernel (allows registering the artisan env as a Jupyter kernel)
ipykernel = "*"

# Pin packaging for Prefect 3.x compatibility
packaging = ">=21.3,<25.1"

# Pin importlib-metadata for opentelemetry-api compatibility (via prefect)
importlib-metadata = ">=6.0,<8.8"

# PostgreSQL for Prefect server (handles concurrency better than SQLite)
postgresql = ">=16"

# Graphviz system binary (dot) for provenance graph rendering
graphviz = "*"

# Core scientific packages
pandas = ">=2.2"
matplotlib = "*"
seaborn = "*"

[tool.pixi.pypi-dependencies]
dexterity-artisan = { path = ".", editable = true }

# Essential packages
rootutils = ">=1.0"
rich = "*"
beartype = "*"
pydantic = "*"
fsspec = "*"
griffe = "*"          # Google-style docstring parsing for agent-facing schemas

# Workflow orchestration
prefect = { version = ">=3.6,<4.0", extras = ["dask"] }
prefect-submitit = ">=0.1.5"
submitit = "*"  # For SLURM job submission
asyncpg = "*"  # PostgreSQL async driver for Prefect server

# Lineage tracking dependencies
xxhash = "*"           # Fast hashing for file tracking

# Delta Lake storage layer
deltalake = ">=0.14.0"  # Delta Lake Python bindings (delta-rs, no JVM required)
polars = ">=0.20.0"     # DataFrame operations with native Delta Lake support

# Visualization
graphviz = "*"          # Python bindings for Graphviz (provenance graph visualization)

# Cloud compute routing
modal = "*"             # Modal SDK for remote compute routing
httpx = "*"             # Tool-endpoint client (submit/poll/download/cancel)
python-dotenv = "*"     # .env fallback for proxy-auth token discovery

# =============================================================================
# DEV FEATURE - Development tools (testing, linting, debugging, notebooks)
# =============================================================================
[tool.pixi.feature.dev.dependencies]
# Interactive development
ipython = "*"
ipykernel = "*"
notebook = ">=7.5.0,<8"
jupyterlab = ">=4.5.0,<5"

# Testing
pytest = "*"
pytest-xdist = "*"  # Parallel test execution
nbval = "*"  # Notebook execution as pytest items (see [tool.pytest.ini_options] markers)

# Linting and formatting
ruff = "==0.13.2"
pre-commit = "=4.3.0,<5"
mypy = "==1.18.2"

# Visualization
bokeh = ">=3.1.0"

# Utilities
absl-py = ">=2.3.1,<3"

[tool.pixi.feature.dev.pypi-dependencies]
# Debugging
icecream = "*"

# Packaging
build = ">=1.4.0,<2"
twine = ">=6.2.0,<7"

# S3 testing — pulled in for unit-parametrized [local, s3] coverage and the
# E2E MinIO integration test. Production users still install via the
# `artisan[s3]` extra; this duplication is intentional so dev gets s3fs
# without the extra.
s3fs = "*"
testcontainers = { version = "*", extras = ["minio"] }

# =============================================================================
# DOCS FEATURE - Documentation packages (Jupyter Book 2)
# =============================================================================
[tool.pixi.feature.docs.dependencies]
# Node.js required for Jupyter Book 2 (from conda-forge)
nodejs = ">=20"

[tool.pixi.feature.docs.pypi-dependencies]
# Jupyter Book 2.x (uses MyST under the hood)
jupyter-book = ">=2.0.0"
mystmd = ">=1.3.0"

# =============================================================================
# ENVIRONMENTS
# =============================================================================
[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

# =============================================================================
# TASKS
# =============================================================================
[tool.pixi.tasks]
# One-time post-install fixups. Contributors run `pixi run setup` once after
# cloning (or `pixi run -e dev setup` to also install pre-commit hooks).
# Body lives in scripts/setup.sh so it has a real shell; idempotent.
setup = "bash scripts/setup.sh"

prefect-start = "prefect-server start --bg"
prefect-stop = "prefect-server stop --force"
install-kernel = "python -m ipykernel install --user --name=artisan --display-name='Artisan'"

[tool.pixi.feature.dev.tasks]
test = "pytest -m 'not integration and not notebook and not modal' && pytest -m integration -n 4 && pytest -m notebook -n 4 --dist=loadfile --nbval-lax docs/tutorials/"  # Unit sequential + integration parallel + tutorial notebooks
test-seq = "pytest -m 'not notebook and not modal'"  # Fully sequential (for debugging test interactions)
test-unit = "pytest -m 'not integration and not notebook and not modal'"  # Run only unit tests
test-integration = "pytest -m integration -n 4"  # Run only integration tests in parallel
test-notebook = "pytest -m notebook -n 4 --dist=loadfile --nbval-lax docs/tutorials/"  # Execute every CI-runnable tutorial notebook end-to-end (loadfile keeps all cells of one notebook on one worker)
test-modal = "pytest -m modal -n 2"  # Real-Modal smoke tests; needs MODAL_TOKEN_ID/MODAL_TOKEN_SECRET (or ~/.modal.toml)
test-modal-seq = "pytest -m modal"  # Sequential variant for debugging Modal tests
fmt = "ruff format . && ruff check --fix ."
build-dist = "rm -rf dist/ && python -m build"
check-dist = "python -m twine check dist/*"
upload-testpypi = "python -m twine upload --repository testpypi dist/*"
upload-pypi = "python -m twine upload dist/*"


[tool.pixi.feature.docs.tasks]
docs-build = { cmd = "jupyter-book build --html", cwd = "docs" }
docs-clean = { cmd = "jupyter-book clean", cwd = "docs" }
docs-serve = { cmd = "python -m http.server -d _build/html 8000", cwd = "docs" }

# =============================================================================
# TOOL CONFIGURATIONS
# =============================================================================
[tool.pytest.ini_options]
minversion = "7"
testpaths = ["tests"]
pythonpath = ["tests"]
log_cli_level = "INFO"
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "integration: needs real infra (Delta Lake, Prefect harness) — run with '-m integration'",
    "notebook: executes a tutorial notebook end-to-end via nbval (auto-applied by tests/conftest.py)",
    "modal: ships work to real Modal cloud — needs MODAL_TOKEN_ID/MODAL_TOKEN_SECRET — run with '-m modal'",
]

[tool.mypy]
# Point mypy at the package source root (`src/artisan`) and the tests
# tree. `mypy_path = "src"` makes `artisan.*` the canonical module prefix;
# without it and with `files = ["src", "tests"]` mypy sees the same file
# under both `src.artisan.*` and `artisan.*` and aborts.
mypy_path = "src"
files = ["src/artisan", "tests"]
exclude = "^_dev/"
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Tests dir uses namespace-style conftest.py files (no __init__.py); without these
# flags mypy sees duplicate "conftest" modules and aborts before type-checking.
explicit_package_bases = true
namespace_packages = true

# Tests are not strictly type-checked at the mypy gate. The functional
# gate is pytest, which fires when tests drift from real src signatures.
# This override makes mypy silent on tests/** so the pre-commit mypy
# hook can pass while src/artisan stays under strict mode (top-level).
# A later phase tightens this incrementally back toward strict; see
# _dev/design/0_current/precommit-state-and-reinstatement.md.
[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
ignore_errors = true

# Third-party libs without py.typed / stubs. Silence import-untyped repo-wide.
# Note: matplotlib, modal, and IPython are listed here because the pre-commit
# mypy hook runs in an isolated environment where those packages aren't
# installed — without this override, the hook would flag them as
# import-not-found even though `pixi run -e dev mypy` sees them via the dev env.
[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "fsspec.*",
    "jsonschema",
    "jsonschema.*",
    "graphviz",
    "prefect_submitit.*",
    "ipywidgets",
    "matplotlib",
    "matplotlib.*",
    "modal",
    "modal.*",
    "IPython",
    "IPython.*",
]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["examples", "_dev", ".pixi", "demos", ".claude"]

[tool.ruff.lint]
extend-select = [
  "ARG",      # flake8-unused-arguments
  "B",        # flake8-bugbear
  "C4",       # flake8-comprehensions
  "EM",       # flake8-errmsg
  "EXE",      # flake8-executable
  "G",        # flake8-logging-format
  "I",        # isort
  "ICN",      # flake8-import-conventions
  "NPY",      # NumPy specific rules
  "PD",       # pandas-vet
  "PGH",      # pygrep-hooks
  "PIE",      # flake8-pie
  "PL",       # pylint
  "PT",       # flake8-pytest-style
  # PTH (flake8-use-pathlib) disabled: framework uses str paths + os.path
  # to support cloud URIs (S3/GCS). See 02-storage-layer.md.
  "RET",      # flake8-return
  "RUF",      # Ruff-specific
  "SIM",      # flake8-simplify
  "T20",      # flake8-print
  "UP",       # pyupgrade
  "YTT",      # flake8-2020
]
ignore = [
  "PLC0415",  # Deferred imports are intentional (circular deps, optional deps)
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "G004",     # logging-f-string — readable idiom; lazy-eval perf cost is negligible here
  "PLW0603",  # global-statement — intentional for module-level state (e.g. prefect server settings context)
]
isort.required-imports = ["from __future__ import annotations"]
# Uncomment if using a _compat.typing backport
# typing-modules = ["artisan._compat.typing"]

[tool.ruff.lint.per-file-ignores]
# Src: ARG001/ARG002 — many methods implement protocol / abstract-base
# signatures and keep unused args for interface conformance. The caller
# relies on the signature shape, so renaming the arg or dropping it is
# not an option.
"src/**" = ["ARG001", "ARG002"]
# No future-annotations: cloudpickled route handlers are rebuilt in the
# endpoint container, where string annotations cannot resolve.
"src/artisan/execution/tool_endpoint/deploy.py" = ["I002"]
# Tests: allow unused fixture args (ARG — capsys/monkeypatch declared to
# activate), late imports (E402 — rootutils setup before project imports),
# prints (T20 — diagnostic output in debugging tests), pytest-style rules
# that are legitimate in many test patterns (B017 broad-exception raises,
# PT011/012/017/019, RUF043 ambiguous-regex), and PLW2901 (loop variable
# overwritten by assignment — benign in short loops).
"tests/**" = [
    "ARG",
    "B017",
    "E402",
    "PLW2901",
    "PT011",
    "PT012",
    "PT017",
    "PT019",
    "RUF043",
    "T20",
]
# Tutorial demo scripts: prints are the demo's whole point; shebang is for
# readability, not executability (users run via pixi, not directly).
"docs/tutorials/**/*.py" = ["EXE001", "T20"]
# Notebooks: allow prints (tutorial narrative), direct open() calls
# (pedagogical; context-manager is taught separately), and typographic
# unicode characters (× in multiplication, – en-dash in prose).
"docs/**/*.ipynb" = ["RUF002", "RUF003", "SIM115", "T20"]
"noxfile.py" = ["T20"]

[tool.codespell]
skip = "pixi.lock,_dev/**"
# Repo-specific terms codespell misflags. Extend as new false positives surface.
# "ser" — SER appears in test data (serialization-format constants); not a typo for SET.
ignore-words-list = "ser"

[dependency-groups]
dev = ["nameisok>=0.1.8,<0.2"]
