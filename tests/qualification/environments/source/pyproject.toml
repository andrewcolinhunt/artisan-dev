[project]
name = "qualification-native-probe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["packaging==24.2", "qualification-helper==0.1.0"]
[project.scripts]
ProbeCLI = "native_probe:main"
[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/native_probe"]
[tool.hatch.build.targets.wheel.force-include]
"assets/factor.json" = "native_probe/_assets/factor.json"
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = "==0.83.0"
[tool.pixi.dependencies]
python = "==3.12.12"
[tool.pixi.pypi-dependencies]
qualification-native-probe = {path=".", editable=true}
qualification-helper = {path="helper", editable=true}
[tool.pixi.activation]
scripts = ["activate.sh"]
[tool.dexterity-artisan.environment]
assets = ["runtime/config.json"]
