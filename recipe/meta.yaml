{% set name = "dexterity-artisan" %}
{% set version = environ.get("GIT_DESCRIBE_TAG", "v0.0.0").lstrip("v") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Build the checked-out release tag. hatch-vcs derives the Python package
  # version from the same Git source, so Conda and Python package metadata agree.
  git_url: ../

build:
  noarch: python
  number: 0
  skip: {{ (environ.get("GIT_DESCRIBE_NUMBER", 0) | int) != 0 }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.12
    - cloudpickle >=3,<4
    - deltalake >=0.14.0
    - fsspec
    - graphviz
    - python-graphviz
    - griffe
    - httpx
    - ipython
    - ipywidgets
    - matplotlib-base
    - polars >=0.20.0
    - pydantic >=2
    - python-dotenv
    - rich
    - xxhash

test:
  imports:
    - artisan
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/dexterity-systems/artisan
  summary: A domain-agnostic pipeline framework with provenance tracking
  description: |
    Artisan is a pipeline framework that gives computational tools a common
    interface and chains them into tracked, repeatable workflows. Every result
    is automatically linked back to the inputs and parameters that produced it.
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://artisan.readthedocs.io
  dev_url: https://github.com/dexterity-systems/artisan

extra:
  recipe-maintainers:
    - andrewcolinhunt
    - anantmittal
