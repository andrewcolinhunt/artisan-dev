ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"

repos:
  # Run Black on Python code blocks in documentation files.
  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.20.0"
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.*]
        # Files with intentional pseudo-code (`...` in arg lists, incomplete snippets)
        # that Black cannot parse. Keep the list explicit, not a blanket dir exclude.
        exclude: |
          (?x)^(
            docs/how-to-guides/creating-artifact-types\.md|
            docs/contributing/coding-conventions\.md|
            skills/pipeline-write/SKILL\.md|
            docs/how-to-guides/writing-curator-operations\.md
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files # Prevent giant files from being committed.
      - id: check-case-conflict # Check for files with names that would conflict on a case-insensitive filesystem like MacOS HFS+ or Windows FAT.
      - id: check-merge-conflict # Check for files that contain merge conflict strings.
      - id: check-symlinks # Checks for symlinks which do not point to anything.
      - id: check-yaml # Attempts to load all yaml files to verify syntax.
        exclude: ^recipe/meta\.yaml$ # Jinja template — not loadable by pyyaml
      - id: debug-statements # Check for debugger imports
      - id: end-of-file-fixer # Makes sure files end in a newline and only a newline.
        exclude: ^docs/tutorials/[^/]+/runs/ # Delta Lake fixture subtree (_delta_log JSON, parquet)
      - id: mixed-line-ending # Replaces or checks mixed line ending.
      - id: name-tests-test # verifies that test files are named correctly.
        args: ["--pytest-test-first"] # ensure tests match test_.*\.py
        exclude: ^tests/fixtures/csv\.py$ # fixture-builder helper, not a test
      - id: trailing-whitespace # Trims trailing whitespace.
        exclude: ^docs/tutorials/[^/]+/runs/ # Delta Lake fixture subtree

  # A collection of fast, cheap, regex based pre-commit hooks.
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.6.2"
    hooks:
      - id: prettier
        # Markdown dropped: no MyST-aware Markdown formatter handles Jupyter Book 2's
        # directive surface reliably. Contributors hand-format Markdown. Python code
        # blocks in docs are still covered by blacken-docs above.
        types_or: [yaml, json]
        exclude: ^recipe/meta\.yaml$ # Jinja template — prettier can't parse

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.13.2"
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi]
        args: ["--fix", "--show-fixes"]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.18.2"
    hooks:
      - id: mypy
        files: src|tests
        args: []
        additional_dependencies:
          - botocore
          - cloudpickle
          - fastmcp>=3
          - fsspec
          - griffe
          - httpx
          - pytest
          - pydantic
          - polars>=0.20.0
          - pydantic-settings
          - python-dotenv
          - xxhash
          - deltalake>=0.14.0
          - rich
          - typer

  # Fix common misspellings in text files.
  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.1"
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "v0.11.0.1"
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: .pre-commit-config.yaml

  # Automated checks on pyproject.toml powered by JSON Schema definitions
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "v0.24.1"
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.34.0"
    hooks:
      - id: check-github-workflows
      - id: check-readthedocs

  # Review repos for compliance to the Scientific-Python development guidelines
  - repo: https://github.com/scientific-python/cookie
    rev: "2025.10.01"
    hooks:
      - id: sp-repo-review
